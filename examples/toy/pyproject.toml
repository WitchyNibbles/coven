[project]
name = "toy"
version = "0.1.0"
description = "A tiny project to try coven on"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "diff-cover>=10.6.0",
    "mypy>=2.4.0",
    "pytest>=9",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src"]

[tool.ruff]
extend = "../../.coven/ruff.toml"
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["N"]

[tool.mypy]
strict = true
files = ["src"]
enable_error_code = [
    "ignore-without-code",
    "possibly-undefined",
    "truthy-bool",
    "redundant-expr",
    "exhaustive-match",
]

[tool.pytest.ini_options]
strict = true
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
