line-length = 100

[format]
exclude = ["*.md"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "PGH", "RUF100", "ARG", "ERA", "PT",
          "C90", "PLE", "PLW", "PLR0912", "PLR0913", "PLR0915", "S", "FAST"]
ignore = ["S603", "S607"]

[lint.per-file-ignores]
# Ruff resolves these globs against this file's directory (.coven/), so "../" anchors the
# tests pattern at the project root; the test_*.py pattern matches at any depth on its own.
"../**/tests/**" = ["S101", "S105", "S106", "S108", "ARG"]
"**/test_*.py" = ["S101", "S105", "S106", "S108", "ARG"]

[lint.mccabe]
max-complexity = 10
