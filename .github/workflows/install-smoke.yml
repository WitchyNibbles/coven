name: install-smoke

# A clean container installs the plugin from this checkout and uses it: no model call, no API key,
# no secret. See ci/install-smoke/run.sh.
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # COVEN_SMOKE_REQUIRE_INSTALL is left unset on purpose: a failed plugin install then falls
      # back to a green run with a warning annotation. Add `COVEN_SMOKE_REQUIRE_INSTALL: "1"` here
      # once the first run shows that install works in the container, so a broken install fails
      # the job.
      # The release coven was tested on: LAST_TESTED in src/coven/claude_version.py (a test keeps
      # the two equal).
      COVEN_SMOKE_CLAUDE_VERSION: "2.1.325"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the clean image
        run: docker build --build-arg COVEN_SMOKE_CLAUDE_VERSION="$COVEN_SMOKE_CLAUDE_VERSION" --tag coven-install-smoke ci/install-smoke
      - name: Install the plugin and use it
        run: docker run --rm --env COVEN_SMOKE_REQUIRE_INSTALL --volume "$PWD:/src:ro" coven-install-smoke
